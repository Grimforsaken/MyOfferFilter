name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run offer-rule tests
        run: |
          mkdir -p /tmp/myofferfilter-tests
          javac -d /tmp/myofferfilter-tests \
            app/src/main/java/com/grimforsaken/sparkofferfilter/CityPolicy.java \
            app/src/main/java/com/grimforsaken/sparkofferfilter/ActionSafetyGuard.java \
            app/src/main/java/com/grimforsaken/sparkofferfilter/OfferDecisionGuard.java \
            app/src/main/java/com/grimforsaken/sparkofferfilter/OfferCityDetector.java \
            app/src/main/java/com/grimforsaken/sparkofferfilter/OfferEvaluator.java \
            app/src/test/java/com/grimforsaken/sparkofferfilter/OfferEvaluatorTest.java \
            app/src/test/java/com/grimforsaken/sparkofferfilter/SafetyAndLocationTest.java
          java -cp /tmp/myofferfilter-tests com.grimforsaken.sparkofferfilter.OfferEvaluatorTest
          java -cp /tmp/myofferfilter-tests com.grimforsaken.sparkofferfilter.SafetyAndLocationTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOfferFilter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
