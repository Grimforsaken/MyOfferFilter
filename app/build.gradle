plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grimforsaken.sparkofferfilter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.grimforsaken.sparkofferfilter'
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName '1.5.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
